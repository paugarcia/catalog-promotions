controllers:
    resource: ../src/Controller/
    type: annotation

kernel:
    resource: ../src/Kernel.php
    type: annotation

index:
    path: /api/products-with-discounts
    controller: App\Controller\Catalog\Product\GetProductsWithDiscountsController
    methods: [GET]

product_by_id:
    path: /api/products/{productId}
    controller: App\Controller\Catalog\Product\GetProductByIdController
    methods: [GET]

product_create:
    path: /api/products/{productId}
    controller: App\Controller\Catalog\Product\CreateProductController
    methods: [PUT]
